name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build frontend
        run: cd web && npm install && npm run build

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o easypay-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./backend/cmd/api

      - name: Generate checksum
        run: sha256sum easypay-${{ matrix.goos }}-${{ matrix.goarch }} > easypay-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            easypay-${{ matrix.goos }}-${{ matrix.goarch }}
            easypay-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
