server:
  addr: ":8080"
  mode: debug   # debug | release
  read_timeout: 15s
  write_timeout: 15s

database:
  # dsn 留空时由 internal/pkg/defaults + .env 接管
  # （EASYPAY_DB_HOST/PORT/USER/PASSWORD/NAME 可覆盖）
  max_idle_conns: 10
  max_open_conns: 100
  log_level: info

redis:
  # addr/password/db 留空时由 internal/pkg/defaults + .env 接管
  # （EASYPAY_REDIS_PORT、EASYPAY_REDIS_ADDR 可覆盖）
  password: ""
  db: 0

crypto:
  # 32 bytes for AES-256. Override via env EASYPAY_CRYPTO_KEY in production.
  key: "change-me-please-this-is-32bytes"

notify:
  # downstream HTTP notify settings
  timeout: 10s
  max_retries: 8
  backoff_seconds: [15, 60, 300, 900, 1800, 3600, 7200, 14400]

log:
  level: info   # debug | info | warn | error
  format: json  # json | console
